name: Build TotoStats Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719

      - name: Install Android platform
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare web files
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/
          cp style.css app/src/main/assets/
          cp script.js app/src/main/assets/
          cp *.jpg app/src/main/assets/

      - name: Build Android APK and AAB
        run: |
          gradle assembleDebug bundleRelease

      - name: Save build files
        uses: actions/upload-artifact@v4
        with:
          name: TotoStats-build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
